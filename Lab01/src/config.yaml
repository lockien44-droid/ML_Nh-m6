    - {learning_rate: 0.05, n_iterations: 1000, C: 10}
    - {learning_rate: 0.1, n_iterations: 3000, C: 10}
    - {learning_rate: 0.01, n_iterations: 1000, C: 50}
    - {learning_rate: 0.05, n_iterations: 3000, C: 50}
    - {learning_rate: 0.01, n_iterations: 3000, C: 100}

naive_bayes:
  alpha: [1.0, 0.01, 0.1, 0.5, 2.0]
