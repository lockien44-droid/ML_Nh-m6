data:
  encoding: cp1252
  path: data/raw/E-Commerc.csv
  top_products: 20
experiment:
  forecast: rolling_one_day_ahead
  product_scope: fixed_top_products_selected_from_full_train
  selection: mean_rmse_three_expanding_folds_and_validation
models:
  decision_tree:
  - feature_set: basic
    max_depth: 5
    min_samples_leaf: 10
  - feature_set: trend
    max_depth: 5
    min_samples_leaf: 10
  - feature_set: basic
    max_depth: 10
    min_samples_leaf: 20
  - feature_set: trend
    max_depth: 10
    min_samples_leaf: 20
  - feature_set: trend
    max_depth: 4
    min_samples_leaf: 20
  - feature_set: robust
    max_depth: 4
    min_samples_leaf: 20
  - feature_set: trend
    max_depth: 8
    min_samples_leaf: 10
  - feature_set: robust
    max_depth: 8
    min_samples_leaf: 10
  - feature_set: trend
    max_depth: 12
    min_samples_leaf: 5
  - feature_set: robust
    max_depth: 12
    min_samples_leaf: 5
  gradient_boosting:
  - feature_set: basic
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 60
  - feature_set: trend
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 60
  - feature_set: basic
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 100
  - feature_set: trend
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 100
  - feature_set: robust
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 60
  - feature_set: robust
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 100
  - feature_set: robust
    learning_rate: 0.05
    max_depth: 3
    n_estimators: 80
  - feature_set: robust
    learning_rate: 0.1
    max_depth: 2
    n_estimators: 100
  linear_regression:
  - alpha: 1.0
    feature_set: basic
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 1.0
    feature_set: trend
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 10.0
    feature_set: basic
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 10.0
    feature_set: trend
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 1.0
    feature_set: robust
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 10.0
    feature_set: robust
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 100.0
    feature_set: robust
    learning_rate: 0.1
    n_iterations: 3000
  random_forest:
  - feature_set: basic
    max_depth: 10
    min_samples_leaf: 5
    n_estimators: 60
  - feature_set: trend
    max_depth: 10
    min_samples_leaf: 5
    n_estimators: 60
  - feature_set: trend
    max_depth: 6
    min_samples_leaf: 10
    n_estimators: 40
  - feature_set: robust
    max_depth: 6
    min_samples_leaf: 10
    n_estimators: 40
  - feature_set: robust
    max_depth: 10
    min_samples_leaf: 5
    n_estimators: 60
  - feature_set: trend
    max_depth: 14
    min_samples_leaf: 10
    n_estimators: 80
  - feature_set: robust
    max_depth: 14
    min_samples_leaf: 10
    n_estimators: 80
seed: 42
split:
  train_fraction: 0.6
  validation_fraction: 0.2
