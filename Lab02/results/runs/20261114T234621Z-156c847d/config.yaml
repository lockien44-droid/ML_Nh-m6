data:
  encoding: cp1252
  path: data/raw/E-Commerc.csv
  top_products: 20
models:
  decision_tree:
  - feature_set: basic
    max_depth: 5
    min_samples_leaf: 10
  - feature_set: trend
    max_depth: 5
    min_samples_leaf: 10
  - feature_set: basic
    max_depth: 10
    min_samples_leaf: 20
  - feature_set: trend
    max_depth: 10
    min_samples_leaf: 20
  gradient_boosting:
  - feature_set: basic
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 60
  - feature_set: trend
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 60
  - feature_set: basic
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 100
  - feature_set: trend
    learning_rate: 0.05
    max_depth: 2
    n_estimators: 100
  linear_regression:
  - alpha: 1.0
    feature_set: basic
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 1.0
    feature_set: trend
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 10.0
    feature_set: basic
    learning_rate: 0.1
    n_iterations: 3000
  - alpha: 10.0
    feature_set: trend
    learning_rate: 0.1
    n_iterations: 3000
  random_forest:
  - feature_set: basic
    max_depth: 10
    min_samples_leaf: 5
    n_estimators: 60
  - feature_set: trend
    max_depth: 10
    min_samples_leaf: 5
    n_estimators: 60
seed: 42
split:
  train_fraction: 0.6
  validation_fraction: 0.2
